[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cplkit"
version = "0.5.0"
description = "Gaussian and ORCA TD-DFT/TDA post-processing for circularly polarized luminescence studies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "CPLkit contributors" }
]
keywords = [
  "circularly polarized luminescence",
  "Gaussian",
  "ORCA",
  "TD-DFT",
  "transition moment density",
  "electric dipole transition moment",
  "magnetic dipole transition moment"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
  "numpy>=1.23"
]

[project.urls]
Homepage = "https://github.com/yuuyanagata/CPLkit"
Repository = "https://github.com/yuuyanagata/CPLkit"
Issues = "https://github.com/yuuyanagata/CPLkit/issues"

[project.scripts]
cplkit = "cplkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cplkit*"]
